openapi: 3.0.3

info:
  title: GroundLink API
  version: "1.0.0"
  description: >
    Portfolio sample. GroundLink is a fictional service. This specification shows how I write a
    REST API description in OpenAPI. No real system, endpoint, or customer data is described here.


    The spec covers the REST part of the API: the spacecraft catalog and contact-window scheduling.
    Telemetry is delivered over WebSocket and is out of OpenAPI scope; it is documented on the HTML
    reference page.
  contact:
    name: Daria Kirova
    email: kirovadasha@yandex.ru

servers:
  - url: https://api.groundlink.example/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Catalog
    description: Spacecraft and pass predictions
  - name: Scheduling
    description: Reserving contact windows on an antenna

paths:
  /satellites:
    get:
      tags: [Catalog]
      summary: List satellites
      description: >
        Returns the spacecraft the organization is authorized to track, with the next predicted
        pass for each. Results are paginated with a cursor.
      operationId: listSatellites
      parameters:
        - name: status
          in: query
          description: Filter by spacecraft state. If omitted, all states are returned.
          required: false
          schema:
            type: string
            enum: [operational, commissioning, maintenance, decommissioned]
        - name: station_id
          in: query
          description: Return only spacecraft visible from the given ground station.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of records in the response.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Pagination cursor taken from next_cursor in a previous response.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of spacecraft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SatelliteList'
              example:
                items:
                  - satellite_id: sat_7Kq2
                    norad_id: 49001
                    name: Kestrel-1
                    status: operational
                    next_pass:
                      station_id: gs_north
                      aos: "2026-03-14T09:20:00Z"
                      los: "2026-03-14T09:31:40Z"
                      max_elevation_deg: 61.4
                  - satellite_id: sat_M3ba
                    norad_id: 49014
                    name: Kestrel-2
                    status: operational
                    next_pass: null
                next_cursor: eyJvIjoyfQ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /schedules:
    post:
      tags: [Scheduling]
      summary: Book a contact window
      description: >
        Reserves an antenna for a single pass. The requested interval must fall inside a predicted
        pass returned by listSatellites, and the antenna must be free for that interval.
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
            example:
              satellite_id: sat_7Kq2
              station_id: gs_north
              start: "2026-03-14T09:22:00Z"
              end: "2026-03-14T09:30:00Z"
              purpose: payload_download
              priority: 2
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              example:
                schedule_id: sch_R48tvQ
                state: confirmed
                satellite_id: sat_7Kq2
                station_id: gs_north
                start: "2026-03-14T09:22:00Z"
                end: "2026-03-14T09:30:00Z"
                created_at: "2026-03-13T15:02:11Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The antenna is already reserved for an overlapping interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: window_conflict
                  message: The requested interval overlaps a confirmed reservation.
                  request_id: req_9f2c1b
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Bearer token in the Authorization header. Token lifetime is 12 hours. Scopes:
        catalog:read, schedule:write, telemetry:read.

  schemas:
    NextPass:
      type: object
      nullable: true
      description: Next predicted pass. null if no pass is predicted within 72 hours.
      properties:
        station_id:
          type: string
          description: Ground station that will see the pass.
        aos:
          type: string
          format: date-time
          description: Acquisition of signal (AOS), UTC.
        los:
          type: string
          format: date-time
          description: Loss of signal (LOS), UTC.
        max_elevation_deg:
          type: number
          description: Highest elevation the spacecraft reaches during the pass, in degrees.

    Satellite:
      type: object
      properties:
        satellite_id:
          type: string
          description: Identifier of the spacecraft in GroundLink.
        norad_id:
          type: integer
          description: Public catalog number of the object.
        name:
          type: string
          description: Display name of the spacecraft.
        status:
          type: string
          enum: [operational, commissioning, maintenance, decommissioned]
          description: Current state of the spacecraft.
        next_pass:
          $ref: '#/components/schemas/NextPass'

    SatelliteList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Satellite'
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page. null on the last page.

    ScheduleRequest:
      type: object
      required: [satellite_id, station_id, start, end]
      properties:
        satellite_id:
          type: string
          description: Spacecraft to contact.
        station_id:
          type: string
          description: Ground station to reserve.
        start:
          type: string
          format: date-time
          description: Start of the window, UTC. Not earlier than the pass AOS.
        end:
          type: string
          format: date-time
          description: End of the window, UTC. Not later than the pass LOS.
        purpose:
          type: string
          enum: [telemetry, command, payload_download]
          default: telemetry
          description: Purpose of the contact window.
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: 1 is the highest priority. Used to resolve competing requests.

    Schedule:
      type: object
      properties:
        schedule_id:
          type: string
          description: Reservation identifier. Used to open a telemetry stream.
        state:
          type: string
          enum: [confirmed, pending, rejected]
          description: confirmed - the antenna is reserved; pending - competing with a higher-priority request.
        satellite_id:
          type: string
        station_id:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable description.
            request_id:
              type: string
              description: Request identifier to quote when contacting support.

  responses:
    BadRequest:
      description: A parameter or the request body is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_parameter
              message: The parameter 'limit' is out of range.
              request_id: req_1a2b3c
    Unauthorized:
      description: The token is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: token_expired
              message: The access token has expired.
              request_id: req_4d5e6f
    Forbidden:
      description: The token lacks the required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: scope_missing
              message: The token is missing the required scope.
              request_id: req_7g8h9i
    RateLimited:
      description: Rate limit exceeded. Retry after the pause given in the Retry-After header.
      headers:
        Retry-After:
          description: How many seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limited
              message: Rate limit exceeded for this scope.
              request_id: req_0j1k2l
